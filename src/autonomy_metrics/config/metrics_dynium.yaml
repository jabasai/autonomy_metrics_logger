# MDBI logger config for the dynium platform.
#
# Roles understood by autonomy_metrics/metric_logger.py:
#   odometry           -> distance / speed integration (billing critical)
#   autonomous_mode    -> Bool, true = Autonomous. Auto->Manual is the ONLY MDBI incident source
#   robot_state        -> String, logged on every change (never counted)
#   estop              -> Bool, logged + counted while autonomous
#   collision_detector -> nav2_msgs/CollisionDetectorState, one incident per detection episode
#   collision_nav / collision_output -> legacy cmd_vel comparison (kept, unused here)
#   sentor_channel     -> Bool on /<channel>/heartbeat, logged on every transition
#   sentor_failures    -> String JSON on /sentor/active_failures, logged when the failure set changes
#   (no role)          -> generic snapshot topic, supports intervention_on_message /
#                         intervention_on_change / battery_field / publish

git_repos:
  # all repos are with reference to /home/ros/aoc_strawberry_scenario_ws/src/aoc_strawberry_scenario
  scenario: "."
  # JABAS repos
  autonomy_metrics_logger: "jabas/autonomy_metrics_logger"
  jabas_lio: "jabas/jabas_lio"
  nav2_costmap_row_controller: "jabas/nav2_costmap_row_controller"
  pointcloud_processing: "jabas/pointcloud_processing"
  sentor: "jabas/sentor"
  topological_navigation: "jabas/topological_navigation"
  trimble_api_interface: "jabas/trimble_api_interface"
  # Contrib repos
  livox_laser_simulation_ros2: "contrib/livox_laser_simulation_ros2"
  livox_ros_driver2: "contrib/livox_ros_driver2"
  trimble_gnss_driver_ros2: "contrib/trimble_gnss_driver_ros2"
  # Robot repos
  dogtooth_platform: "robots/dogtooth_platform"
  dogtooth_robot: "robots/dogtooth_robot"
  hunter_platform: "platforms/hunter"
  hunter_robot: "robots/hunter_robot"
  hunter_ros2: "robots/hunter_ros2"
  ppl_gofar_platform: "robots/ppl_gofar_platform"
  ugv_sdk: "robots/ugv_sdk"

topics:
  # ---------------------------------------------------------
  # Distance / speed (billing critical)
  # ---------------------------------------------------------
  # Wheel odometry is the distance source: it never teleports, unlike
  # /odometry/global which jumps whenever the GNSS/EKF re-converges.
  - name: "/gophar_vehicle_controller/odometry"
    type: "nav_msgs/msg/Odometry"
    role: "odometry"
    log_fields:
      - "pose.pose.position.x"
      - "pose.pose.position.y"
      - "twist.twist.linear.x"
    publish:
      enable: false

  # ---------------------------------------------------------
  # Mode / state (MDBI attribution)
  # ---------------------------------------------------------
  # Published by sentor_state_machine. true => Autonomous, false => Manual.
  - name: "/autonomous_mode"
    type: "std_msgs/msg/Bool"
    role: "autonomous_mode"

  # "start-up" | "disabled" | "enabled" | "active"
  - name: "/robot_state"
    type: "std_msgs/msg/String"
    role: "robot_state"

  # ---------------------------------------------------------
  # Collision incidents (nav2 collision_detector)
  # ---------------------------------------------------------
  # detections[] is aligned with polygons[]. Any true entry starts a detection
  # episode; exactly one incident is counted per episode.
  - name: "/collision_detector_state"
    type: "nav2_msgs/msg/CollisionDetectorState"
    role: "collision_detector"

  # ---------------------------------------------------------
  # Sentor channel heartbeats (status changes)
  # ---------------------------------------------------------
  # Channel names must match sentor's `channels:` block.
  - name: "/system_check/heartbeat"
    type: "std_msgs/msg/Bool"
    role: "sentor_channel"
    channel: "system_check"
    event_type: "Sentor_system_check_failed"
    count_incident: false

  - name: "/autonomy_checks/heartbeat"
    type: "std_msgs/msg/Bool"
    role: "sentor_channel"
    channel: "autonomy_checks"
    event_type: "Sentor_autonomy_checks_failed"
    count_incident: false

  # navigation_safe failing while autonomous is a genuine autonomy failure,
  # so it counts towards MDBI (only when the robot is in Autonomous mode).
  - name: "/navigation_safe/heartbeat"
    type: "std_msgs/msg/Bool"
    role: "sentor_channel"
    channel: "navigation_safe"
    event_type: "Sentor_navigation_safe_failed"
    count_incident: true

  - name: "/system_warning/heartbeat"
    type: "std_msgs/msg/Bool"
    role: "sentor_channel"
    channel: "system_warning"
    event_type: "Sentor_system_warning"
    count_incident: false

  # Latched JSON array with name/description/instruction/priority per failure.
  # Gives every event a human-readable root cause.
  - name: "/sentor/active_failures"
    type: "std_msgs/msg/String"
    role: "sentor_failures"

  # ---------------------------------------------------------
  # Battery + platform status
  # ---------------------------------------------------------
  - name: "/gophar/system_status"
    type: "dynium_gophar_interfaces/msg/SystemStatus"
    role: "system_status"
    log_all_fields: true
    battery_field: "battery_percentage"
    publish:
      enable: true
      topic: "mdbi_logger/battery_level"
      type: "std_msgs/msg/Float32"
      field: "battery_percentage"
    intervention_on_change:
      fault_shutdown:
        trigger_value: true
        event_type: "Fault_shutdown"

  # ---------------------------------------------------------
  # Manual takeover triggers
  # ---------------------------------------------------------
  - name: "/cmd_vel_joy_smoothed"
    type: "geometry_msgs/msg/Twist"
    log_fields: []
    intervention_on_message:
      enable: true
      event_type: "Joy_override"

  # Radio handset taking control is a takeover event, logged once per change.
  - name: "/gophar/teleradio_active"
    type: "std_msgs/msg/Bool"
    log_fields: ["data"]
    intervention_on_change:
      data:
        trigger_value: true
        event_type: "Teleradio_override"

  # ---------------------------------------------------------
  # Health snapshot topics (context attached to every event)
  # ---------------------------------------------------------
  - name: "/gps_base/fix"
    type: "sensor_msgs/msg/NavSatFix"
    log_fields:
      - "status.status"
      - "latitude"
      - "longitude"
      - "position_covariance[0]"
      - "position_covariance[4]"

  - name: "/odometry/global"
    type: "nav_msgs/msg/Odometry"
    log_fields:
      - "pose.pose.position.x"
      - "pose.pose.position.y"
      - "pose.covariance[0]"
      - "pose.covariance[7]"

  - name: "/gophar/can_healthy"
    type: "std_msgs/msg/Bool"
    log_fields: ["data"]
    intervention_on_change:
      data:
        trigger_value: false
        event_type: "CAN_unhealthy"

  # LIO health is latched (TRANSIENT_LOCAL), so subscribe latched to receive
  # the current value even if it was published before this node started.
  - name: "/lio/failure_reason"
    type: "std_msgs/msg/String"
    qos: "latched"
    log_fields: ["data"]

  # Listed after the reason topic so the reason is already in the snapshot
  # attached to the LIO_failed event.
  - name: "/lio/failed"
    type: "std_msgs/msg/Bool"
    qos: "latched"
    log_fields: ["data"]
    intervention_on_change:
      data:
        trigger_value: true
        event_type: "LIO_failed"

  - name: "/jabas_health"
    type: "std_msgs/msg/Bool"
    qos: "latched"
    log_fields: ["data"]

  - name: "/gophar/motor_status/motor_0"
    type: "dynium_gophar_interfaces/msg/MotorStatus"
    log_fields: ["motor_temp", "mosfet_temp"]

  - name: "/gophar/motor_status/motor_1"
    type: "dynium_gophar_interfaces/msg/MotorStatus"
    log_fields: ["motor_temp", "mosfet_temp"]
